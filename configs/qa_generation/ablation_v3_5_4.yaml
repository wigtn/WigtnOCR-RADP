# Ablation B: PROMPT v3 + gpt-5.4-2026-03-05
# Purpose: measure model upgrade (4o → 5.4) gain on top of v3 prompt
# Same 20 pages as ablation_v3_4o.yaml (seed=42)
# Cost: ~20 × ~$0.015 = ~$0.30 (5.4 output is ~50% pricier than 4o)

name: ablation_v3_5_4

model:
  provider: openai
  id: gpt-5.4-2026-03-05
  temperature: 0.7
  request_timeout_seconds: 90  # slightly more headroom for larger model
  max_retries: 2

dataset:
  config: configs/data/kogovdoc_bench.yaml
  split: validation

sampling:
  page_indices: null
  num_pages: 20
  mode: random
  seed: 42  # FIXED — same 20 pages as ablation_v3_4o for paired comparison

output:
  path: output/qa_pairs/ablation_v3_5_4.jsonl
  pretty_log_path: output/qa_pairs/ablation_v3_5_4.log

generation:
  num_qa_per_page_min: 2
  num_qa_per_page_max: 3

target_distribution:
  question_type:
    factoid: 0.50
    procedural: 0.30
    tabular: 0.15
    figural: 0.05
  difficulty:
    easy: 0.40
    medium: 0.40
    hard: 0.20
  multi_page_ratio: 0.0

validation:
  answer_span_must_be_substring: true
  answer_chunk_must_be_substring: true
  answer_span_must_be_in_chunk: true
  question_length_range: [5, 200]
  answer_span_length_range: [1, 100]
  answer_chunk_length_range: [50, 1000]
  retry_on_invalid: 1

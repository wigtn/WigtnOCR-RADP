# Q-A generation with GPT-4o-mini (cheaper alternative)
# Inherits from default.yaml; only overrides model.id
# Cost: ~1/10 of GPT-4o. Recommended for sweeps and dev iteration.

name: gpt4o_mini

model:
  provider: openai
  id: gpt-4o-mini-2024-07-18
  temperature: 0.7
  request_timeout_seconds: 60
  max_retries: 2

dataset:
  config: configs/data/kogovdoc_bench.yaml
  split: validation

sampling:
  page_indices: null
  num_pages: 5
  mode: first
  seed: 42

output:
  path: output/qa_pairs/gpt4o_mini.jsonl
  pretty_log_path: output/qa_pairs/gpt4o_mini.log

generation:
  num_qa_per_page_min: 2
  num_qa_per_page_max: 3

target_distribution:
  question_type:
    factoid: 0.50
    procedural: 0.30
    tabular: 0.15
    figural: 0.05
  difficulty:
    easy: 0.40
    medium: 0.40
    hard: 0.20
  multi_page_ratio: 0.30

validation:
  answer_span_must_be_substring: true
  answer_chunk_must_be_substring: true
  answer_span_must_be_in_chunk: true
  question_length_range: [5, 200]
  answer_span_length_range: [1, 100]
  answer_chunk_length_range: [50, 1000]
  retry_on_invalid: 1

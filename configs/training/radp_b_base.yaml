# RADP-B training config (placeholder, will be activated in Week 2)
# Method: chunk-boundary contrastive auxiliary loss on top of v1 LoRA
# Reference: docs/RADP_RESEARCH_PROPOSAL.md §4.1

name: radp_b_base
status: placeholder  # not yet runnable; finalize after Week 2 implementation

base_model:
  hf_id: Wigtn/Qwen3-VL-2B-WigtnOCR
  base_id: Qwen/Qwen3-VL-2B-Instruct

lora:
  rank: 8
  alpha: 32
  dropout: 0.05
  target_modules: all-linear

training:
  framework: ms-swift
  version: "4.2.0"
  precision: bfloat16
  deepspeed_stage: 2
  epochs: 3
  batch_size: 1
  grad_accum: 4
  optimizer: adamw_torch
  scheduler: cosine
  warmup_ratio: 0.05
  freeze_vit: true
  freeze_aligner: true

# RADP-B specific
contrastive:
  loss_coefficient_lambda: 0.3  # sweep: [0.1, 0.3, 0.5, 1.0]
  embedding_model: BAAI/bge-m3
  embedding_frozen: true
  negative_sampling: in_batch  # in_batch | hard_negative | mixed
  temperature: 0.05

learning_rates:
  parse_lr: 1.0e-4
  contrastive_coef_lr: null  # use parse_lr unless tuned

# Hardware
hardware:
  gpus: 2
  gpu_type: RTX_PRO_6000_Blackwell
  expected_runtime_hours: 6

logging:
  output_dir: output/checkpoints/radp_b_base
  log_steps: 10
  eval_steps: 200
  save_steps: 500

[project]
name = "wigtnocr-radp"
version = "0.1.0"
description = "Retrieval-Aware Document Parsing — EMNLP 2026 Industry Track submission"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Hyeong-seob Kim", email = "harry@brain-crew.com" },
    { name = "Sang-woo Son", email = "sangwoo@wigtn.com" },
]
keywords = ["RAG", "document-parsing", "OCR", "retrieval", "VLM", "EMNLP"]

dependencies = [
    "openai>=2.37.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
]
data = [
    "datasets>=3.0",
    "huggingface-hub>=0.24",
]
eval = [
    "torch==2.8.0",
    "sentence-transformers>=3.3",
    "numpy>=2.0",
    "scipy>=1.13",
    "tqdm>=4.66",
]
train = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers>=5.8",
    "peft>=0.14",
    "accelerate>=1.2",
    "numpy>=2.0",
    "sentence-transformers>=3.3",
    "pillow>=10.0",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Pin torch to the cu128 build (Blackwell sm_120 support).
# Driver 575.64.03 is CUDA 12.9; PyTorch's default PyPI wheel ships cu130 which
# is incompatible. cu128 is the first wheel build with sm_120 support.
# Reference: docs/V2_FINDINGS_REPORT.md L2.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/wigtnocr_radp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle / pyflakes
    "I",                # isort
    "B",                # flake8-bugbear
    "UP",               # pyupgrade
    "RUF",              # ruff-specific
]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
]
